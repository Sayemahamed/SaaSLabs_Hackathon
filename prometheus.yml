global:
  scrape_interval:     2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: flower
    static_configs:
      - targets: ['flower:5555']
  - job_name: "api_metrics"
    static_configs:
      - targets: ["backend:8001"]