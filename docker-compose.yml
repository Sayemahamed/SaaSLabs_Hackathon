services:


  # BackEnd
  backend:
    build:
      context: ./Backend/API
      dockerfile: Dockerfile.FastAPI
    ports:
      - "8106:8000"
      - "8001:8001"
    volumes:
      - ./Backend/API:/API
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    env_file:
      - .env

  # FrontEnd
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.React
    ports:
      - "8105:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
# Storage
  # Storage (Database)
  db:
    image: timescale/timescaledb-ha:pg17
    ports:
      - "5432:5432"
    volumes:
      - data:/home/postgres/pgdata/data
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
  neo4j:
    image: neo4j:2025.03
    container_name: neo4j_apoc_container
    environment:
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_AUTH: none
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import

# Storage-services
  vectorizer-worker:
    image: timescale/pgai-vectorizer-worker:latest
    environment:
      PGAI_VECTORIZER_WORKER_DB_URL: postgres://postgres:postgres@db:5432/postgres
    command: [ "--poll-interval", "5s", "--log-level", "DEBUG" ]
    depends_on:
      - db
# Backend-services

  # Backend-services (using Redis/Backend)
  celery:
    build:
      context: ./Backend/CeleryWorker
      dockerfile: Dockerfile.celery
    volumes:
      - ./Backend/CeleryWorker:/app
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env

# Monitoring
  flower:
    build:
      context: ./Backend/CeleryWorker
      dockerfile: Dockerfile.flower
    ports:
      - "5555:5555"
    volumes:
      - ./Backend/CeleryWorker:/app
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
# MCP servers
  tavily_mcp:
    build:
      context: ./Backend/MCP/Tavily
      dockerfile: Dockerfile
    ports:
      - "8107:8000"
    volumes:
      - ./Backend/MCP/Tavily:/app
    env_file:
      - .env
  playwright_mcp:
    build:
      context: ./Backend/MCP/Playwright
      dockerfile: Dockerfile
    ports:
      - "8108:8931"
    volumes:
      - ./Backend/MCP/Playwright:/app
    env_file:
      - .env
volumes:
  data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
